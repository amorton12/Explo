on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
    branches:
      - dev
      - 'feat/**'
  pull_request:
    branches: ['*']
  workflow_dispatch:

name: Latest Release

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint files
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      # Create a dummy directory to appease the go:embed typechecker
      - name: Create dummy dist directory
        run: mkdir -p src/web/dist && touch src/web/dist/index.html

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: latest
  release:
    permissions:
      contents: write
    name: Create Release
    runs-on: 'ubuntu-latest'
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        # List of GOOS and GOARCH pairs from `go tool dist list`
        goosarch:
          - 'linux/amd64'
          - 'linux/386'
          - 'linux/arm64'
          - 'linux/arm'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Create dummy dist directory
        run: mkdir -p src/web/dist && touch src/web/dist/index.html

      - name: Get OS and arch info
        run: |
          GOOSARCH=${{matrix.goosarch}}
          GOOS=${GOOSARCH%/*}
          GOARCH=${GOOSARCH#*/}
          BINARY_NAME=explo-$GOOS-$GOARCH
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_ENV
          echo "GOOS=$GOOS" >> $GITHUB_ENV
          echo "GOARCH=$GOARCH" >> $GITHUB_ENV
      - name: Build binary
        run: |
          go build -ldflags "-X explo/src/config.Version=${{ github.ref_name }}" -o "$BINARY_NAME" -v ./src/main/
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: ${{env.BINARY_NAME}}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build/publish container image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # only build latest from tagged versions
    needs: release
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag_suffix: amd64
            s6_overlay_arch: x86_64
          - platform: linux/arm64
            tag_suffix: arm64
            s6_overlay_arch: aarch64
          - platform: linux/arm/v7
            tag_suffix: armv7
            s6_overlay_arch: arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize image repository name
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.ref_name }}-${{ matrix.tag_suffix }}
            ${{ env.IMAGE_REPO }}:latest-${{ matrix.tag_suffix }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ matrix.platform }}
          build-args: |
            TARGETARCH
            S6_OVERLAY_ARCH=${{ matrix.s6_overlay_arch }}
            VERSION=${{ github.ref_name }}

  build-manifest:
    name: Publish release manifest
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize image repository name
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish release manifest
        run: |
          docker buildx imagetools create \
            -t $IMAGE_REPO:${{ github.ref_name }} \
            -t $IMAGE_REPO:latest \
            $IMAGE_REPO:${{ github.ref_name }}-amd64 \
            $IMAGE_REPO:${{ github.ref_name }}-arm64 \
            $IMAGE_REPO:${{ github.ref_name }}-armv7

  build-dev:
    name: Build/publish dev image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: dev-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag_suffix: amd64
            s6_overlay_arch: x86_64
          - platform: linux/arm64
            tag_suffix: arm64
            s6_overlay_arch: aarch64
          - platform: linux/arm/v7
            tag_suffix: armv7
            s6_overlay_arch: arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize image repository name
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:dev-${{ matrix.tag_suffix }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ matrix.platform }}
          build-args: |
            TARGETARCH
            S6_OVERLAY_ARCH=${{ matrix.s6_overlay_arch }}

  build-dev-manifest:
    name: Publish dev manifest
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    needs: build-dev
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize image repository name
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish dev manifest
        run: |
          docker buildx imagetools create \
            -t $IMAGE_REPO:dev \
            $IMAGE_REPO:dev-amd64 \
            $IMAGE_REPO:dev-arm64 \
            $IMAGE_REPO:dev-armv7

  build-preview:
    name: Build/publish preview image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/feat/')
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: preview-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag_suffix: amd64
            s6_overlay_arch: x86_64
          - platform: linux/arm64
            tag_suffix: arm64
            s6_overlay_arch: aarch64
          - platform: linux/arm/v7
            tag_suffix: armv7
            s6_overlay_arch: arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize image repository name
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Compute preview tag
        run: |
          branch="${GITHUB_REF_NAME}"
          branch_slug="$(echo "$branch" | tr '/[:space:]' '-' | tr -cd '[:alnum:]._-')"
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          preview_tag="${branch_slug}-${short_sha}"
          echo "PREVIEW_TAG=${preview_tag}" >> "$GITHUB_ENV"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:preview-${{ env.PREVIEW_TAG }}-${{ matrix.tag_suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ matrix.platform }}
          build-args: |
            TARGETARCH
            S6_OVERLAY_ARCH=${{ matrix.s6_overlay_arch }}

  build-preview-manifest:
    name: Publish preview manifest
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/feat/')
    needs: build-preview
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize image repository name
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Compute preview tag
        run: |
          branch="${GITHUB_REF_NAME}"
          branch_slug="$(echo "$branch" | tr '/[:space:]' '-' | tr -cd '[:alnum:]._-')"
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          preview_tag="${branch_slug}-${short_sha}"
          echo "PREVIEW_TAG=${preview_tag}" >> "$GITHUB_ENV"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish preview manifest
        run: |
          docker buildx imagetools create \
            -t $IMAGE_REPO:preview-${{ env.PREVIEW_TAG }} \
            $IMAGE_REPO:preview-${{ env.PREVIEW_TAG }}-amd64 \
            $IMAGE_REPO:preview-${{ env.PREVIEW_TAG }}-arm64 \
            $IMAGE_REPO:preview-${{ env.PREVIEW_TAG }}-armv7
